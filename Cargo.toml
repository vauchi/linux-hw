[package]
name = "vauchi-linux-hw"
version = "0.98.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/vauchi/linux-hw"
authors = ["Vauchi Contributors"]
description = "Presentation-independent native execution of Vauchi platform commands"
publish = false

[dependencies]
# The shell contract (ADR-078): the only Vauchi crate a hardware shell depends on.
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.97.1", version = "^0.97" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# The QR decoder (feature `qr-decode`): rqrr from the fork patched in below,
# rxing as the fast first pass, image for the gray frame type.
rqrr = { version = "0.11", optional = true }
mdns-sd = { version = "0.11", optional = true }
rxing = { version = "0.8", default-features = false, features = ["encoding_rs"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pcsc = { version = "2", optional = true }
alsa = { version = "0.9", optional = true }
nokhwa = { version = "0.10", features = ["input-v4l"], optional = true }
zbus = { version = "=6.0.0", default-features = false, features = ["tokio"] }
uuid = { version = "1", default-features = false }
tokio = { version = "1", features = ["net"] }

[features]
# Test support: the scripted BlueZ that hosts of `BlueZDiscovery` test
# against (src/fake_bluez.rs).
fake-bluez = []
# The PC/SC reader behind the NFC port (USB NFC readers through pcsclite).
nfc = ["dep:pcsc"]
# The ALSA devices behind the audio port (ultrasonic proximity); PipeWire and
# PulseAudio hosts serve it through their ALSA layer.
audio = ["dep:alsa"]
# QR decoding from luma frames (moved from Core, owner Q1/Q3 2026-11-02).
qr-decode = ["dep:rqrr", "dep:rxing", "dep:image", "dep:serde"]
# The V4L2 camera through nokhwa behind the camera port; scans need the decoder.
camera = ["qr-decode", "dep:nokhwa"]
# mDNS discovery of the phone for direct send; without it, Core's fallback
# host and port are used.
mdns = ["dep:mdns-sd"]

[dev-dependencies]
tempfile = "3"
# The decoder tests render codes and read the camera corpus.
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# The NfcSession tests poll the inbox from the test thread, so the
# executor's worker needs a runtime thread of its own.
tokio = { version = "1", features = ["rt-multi-thread"] }
vauchi-linux-hw = { path = ".", features = ["fake-bluez"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# rqrr 0.11.0 with the clamped Perspective::map (vauchi/utils/rqrr): upstream
# aborts on a near-degenerate QR perspective, uncatchable under
# panic = "abort". The version stays 0.11.0 so this redirects the
# `rqrr = "0.11"` dependency above; tests/rqrr_resolves_from_the_fork.rs
# fails the moment it resolves from anywhere else.
[patch.crates-io]
rqrr = { git = "https://gitlab.com/vauchi/utils/rqrr.git", tag = "v0.11.0+vauchi.1" }

[[example]]
# Rig checks against a phone (ADR-077 item 9); its parser is tested with the crate.
name = "probe"
test = true
