version = 1
SPDX-PackageName = "vauchi-linux-hw"
SPDX-PackageSupplier = "Mattia Egloff <mattia.egloff@pm.me>"

# License files
[[annotations]]
path = ["LICENSES/**"]
SPDX-FileCopyrightText = "Free Software Foundation"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Git and editor config files
[[annotations]]
path = [".gitignore", "**/.gitignore", "**/.gitkeep", ".markdownlintignore"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["**/Cargo.lock"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by cargo-vet, which strips inline SPDX headers
[[annotations]]
path = ["supply-chain/config.toml", "supply-chain/audits.toml", "supply-chain/imports.lock"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Camera corpus frames: image files cannot carry comments.
[[annotations]]
path = ["tests/fixtures/qr-camera-corpus/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vendored fork of rqrr (third-party; one patched function).
[[annotations]]
path = ["vendor/rqrr/**"]
SPDX-FileCopyrightText = "WanzenBug <moritz@wanzenbug.xyz>"
SPDX-License-Identifier = "(MIT OR Apache-2.0) AND ISC"
