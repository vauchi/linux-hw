# GitLab CI for vauchi-linux-hw, the hardware shell (ADR-077).
#
# Docs and licensing gates only, from the shared templates; build and
# test jobs arrive with the first port.

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A merge must not cancel a main pipeline other repos wait on (VCI05).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  interruptible: true

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.10.31
    file:
      - '/ci-templates/lint-docs.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/timeouts.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.10.31"

stages:
  - lint
  - test

# The Rust hardware shell (ADR-077): format, clippy and the tests with the
# fake BlueZ backend on every MR and on main. The real BlueZ, PC/SC and
# PipeWire paths are proven on the rig, not on a runner without radios.
lint:format:
  extends: [.rust-runner-nocache, .lint-format, .mr-or-main, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .mr-or-main, .timeout-standard]
  stage: lint
  needs: []
  script:
    - cargo clippy --all-targets --features fake-bluez -- -D warnings

test:unit:
  extends: [.rust-runner, .mr-or-main, .timeout-standard]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo test --features fake-bluez
