# GitLab CI for vauchi-linux-hw, the hardware shell (ADR-077).
#

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A merge must not cancel a main pipeline other repos wait on (VCI05).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  interruptible: true

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.11.17
    file:
      - '/ci-templates/lint-docs.yml'
      - '/ci-templates/allow-git.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/timeouts.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.17"
  # cargo audit runs with --deny warnings; every entry here is an
  # advisory with no fix available to us, not one we chose to skip.
  #   RUSTSEC-2026-0543  chrono and chrono-tz unmaintained, only via
  #   RUSTSEC-2026-0555  rxing, the QR decoder behind the qr-decode
  #                      feature, now part of camera-preview's default.
  #                      deny.toml carries the same policy (private#1274).
  AUDIT_IGNORES: "--ignore RUSTSEC-2026-0543 --ignore RUSTSEC-2026-0555"

stages:
  - auto-tag
  - lint
  - security
  - test

# A version bump merged to main is the release: the job pushes
# v<Cargo.toml version> when that tag does not exist yet, so the tag always
# sits on the merged commit (private#1045).
auto-tag:version:
  extends: .auto-tag

.native-camera:
  tags: [linux, rust, self-hosted]
  before_script:
    - !reference [.rust-runner, before_script]
    - |
      pkg-config --atleast-version=0.3.77 libpipewire-0.3 ||
        flock /tmp/vauchi-camera-sdk.lock sh -ec '
          if ! pkg-config --atleast-version=0.3.77 libpipewire-0.3; then
            sudo apt-get -o DPkg::Lock::Timeout=120 update -qq
            sudo apt-get -o DPkg::Lock::Timeout=120 install -y -qq --no-install-recommends libpipewire-0.3-dev libclang-dev
          fi
          pkg-config --atleast-version=0.3.77 libpipewire-0.3
        '

# The Rust hardware shell (ADR-077): format, clippy and the tests with the
# fake BlueZ backend on every MR and on main. The real BlueZ, PC/SC and
# PipeWire paths are proven on the rig, not on a runner without radios.
lint:format:
  extends: [.rust-runner-nocache, .lint-format, .mr-or-main, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .mr-or-main, .timeout-standard, .native-camera]
  stage: lint
  needs: []
  script:
    - cargo clippy --all-targets --features fake-bluez,qr-decode -- -D warnings

test:unit:
  extends: [.rust-runner, .mr-or-main, .timeout-standard, .native-camera]
  stage: test
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo test --features fake-bluez,qr-decode

test:audio:
  extends: [.rust-runner, .mr-or-main, .timeout-standard, .native-camera]
  stage: test
  tags: [linux, rust, self-hosted]
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo clippy --locked --all-targets --features audio -- -D warnings
    - cargo test --locked --features audio
    - cargo build --locked --features audio --example audio_lifecycle_probe
    - cargo build --locked --features audio --example audio_acceptance_probe

test:camera:
  extends: [.rust-runner, .mr-or-main, .timeout-standard, .native-camera]
  stage: test
  tags: [linux, rust, self-hosted]
  needs:
    - job: lint:format
      optional: true
  script:
    - cargo clippy --locked --all-targets --features camera -- -D warnings
    - cargo test --locked --features camera

security:audit:
  extends: [.rust-runner-readonly, .security-audit-job]

# cargo-deny on MRs; cargo-vet on MRs that change dependencies and on
# main, both against the committed lockfile. Exemptions only, never
# local audits (VSC01): a dependency change commits its regenerated
# exemptions with it.
security:deny:
  extends: [.rust-runner-readonly, .security-deny-job]

# deny.toml's git sources match the reviewed list in vauchi/scripts
# policy/allowed-git-sources.txt (vauchi/private#1162).
check:allow-git:
  extends: [.allow-git-drift-job]

security:vet:
  extends: [.rust-runner-readonly, .security-vet-job]

github-mirror:
  extends: .github-mirror
